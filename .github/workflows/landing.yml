name: Landing page
on:
  pull_request:
    paths: ['landing/**', 'tools/*landing.mjs', 'docs/images/**', 'src/assets/fonts/**', 'src/assets/openhero68-logo.png', 'package.json', '.github/workflows/landing.yml']
  push:
    branches: [main]
    paths: ['landing/**', 'tools/*landing.mjs', 'docs/images/**', 'src/assets/fonts/**', 'src/assets/openhero68-logo.png', 'package.json', '.github/workflows/landing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - run: npm run package:landing
      - run: npm run check:landing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openhero68-landing-pages
          path: |
            openhero68-landing-pages.zip
            openhero68-landing-pages.zip.sha256
          if-no-files-found: error
